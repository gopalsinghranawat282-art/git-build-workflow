name: build my angular app

on: 
   push: 
    branches:  [ main ]


jobs:
   build-angular:
     runs-on: ubuntu-latest

     steps:
        - uses: actions/setup-node@v4
        - name: Setup node js
          uses: actions/setup-node@v7.1.0
          with: 
             node-version: 22.x
        - name: install dependacies
          run: npm install
        - name: build angular aap
          run: nmp run build
